name: Build and Release (VS 2026 x64)

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: write 

jobs:
  build:
    runs-on: windows-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find MSBuild (VS 2026) and Build x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -version "[18.0,19.0)" -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          
          if (-not $msbuild) {
            throw "Visual Studio 2026 MSBuild not found"
          }
          
          & $msbuild Saper.slnx /m /p:Configuration=Release /p:Platform=x64

      - name: Package release archive
        shell: pwsh
        run: |
          # По умолчанию MSBuild кладёт 64-битную сборку в x64\Release
          Compress-Archive -Path x64/Release/*.exe -DestinationPath app-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-windows-x64.zip
          generate_release_notes: true
